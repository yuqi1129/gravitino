name: Chain Probe
on:
  workflow_dispatch:
    inputs:
      sweep:
        type: boolean
        default: false
      hops:
        type: string
        default: '0'
permissions: {}
jobs:
  sweep:
    if: github.event_name == 'workflow_dispatch' && inputs.sweep
    concurrency:
      group: chain-probe-sweep
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      chain: ${{ steps.sweep.outputs.chain }}
    steps:
      - id: sweep
        uses: actions/github-script@v7
        with:
          script: |
            core.info(`sweep=${JSON.stringify(context.payload.inputs.sweep)} hops=${context.payload.inputs.hops} ref=${context.ref}`);
            await new Promise(r => setTimeout(r, 45000));
            core.setOutput('chain', String(Number(context.payload.inputs.hops) < 3));
  rearm:
    needs: sweep
    if: ${{ !cancelled() && needs.sweep.outputs.chain == 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: repository } = await github.rest.repos.get(context.repo);
            if (context.ref !== `refs/heads/${repository.default_branch}`) return;
            await github.rest.actions.createWorkflowDispatch({ ...context.repo,
              workflow_id: 'chain-probe.yml', ref: repository.default_branch,
              inputs: { sweep: 'true', hops: String(Number(context.payload.inputs.hops) + 1) } });
