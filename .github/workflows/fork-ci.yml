# Backport fork routing v1
name: Fixed bot fork backport test
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: fixed-bot-fork-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.repository == 'yuqi-datastrato/gravitino'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve actual sandbox PR and freeze its release base
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const assert = require('node:assert/strict');
            const outputs = {};
            await require('./.sandbox/resolve.cjs').resolve({ github, context,
              core: { ...core, setOutput: (k,v) => { outputs[k] = v; core.setOutput(k,v); } } });
            assert.equal(outputs.valid, 'true');
            assert.equal(outputs['base-ref'], 'bot-real-base-15014');
            assert.equal(outputs['head-repository'], 'yuqi-datastrato/gravitino');
            assert.equal(outputs['head-sha'], context.sha);
            assert.equal(outputs.sync, 'true');
            core.info(JSON.stringify(outputs));
      - name: Verify the exact head merges with the resolved base
        env:
          BASE_SHA: ${{ steps.resolve.outputs.base-sha }}
          HEAD_SHA: ${{ steps.resolve.outputs.head-sha }}
        run: |
          git fetch --no-tags https://github.com/yuqi1129/gravitino.git "$BASE_SHA"
          git fetch --no-tags https://github.com/yuqi-datastrato/gravitino.git "$HEAD_SHA"
          git merge-tree --write-tree "$BASE_SHA" "$HEAD_SHA"
          test "$(cat .sandbox/change.txt)" = "fixed bot fork backport test"
      - uses: actions/checkout@v4
        with:
          repository: yuqi1129/gravitino
          ref: 8e6b5439e52b1792bd5af39db9c3bdb7909d31dc
          path: implementation
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test the implementation
        working-directory: implementation
        run: node --test .github/scripts/tests/*.test.cjs
