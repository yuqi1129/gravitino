name: Fork CI
run-name: "${{ inputs.mode == 'trusted-switch' && 'Trusted Fork CI #14990' || format('Fork CI {0}', inputs.mode) }}"
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [invalid-failure, invalid-success, valid-success, trusted-switch, current-failure, watcher-only]
        default: invalid-failure
permissions:
  contents: read
jobs:
  eligibility:
    name: Resolve fork CI eligibility
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.context.outputs.sha }}
      head: ${{ steps.context.outputs.head }}
    steps:
      - id: context
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = valid-success ] || [ "$MODE" = trusted-switch ] || [ "$MODE" = current-failure ] || [ "$MODE" = watcher-only ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo 'sha=0000000000000000000000000000000000000001' >> "$GITHUB_OUTPUT"
          fi
          if [ "$MODE" = trusted-switch ] && [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            echo 'head=6a23a35eaf0b74bbb7ab579f559653479ff0abd0' >> "$GITHUB_OUTPUT"
          else
            echo "head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: build / changes
    needs: eligibility
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Sandbox build passed'
  backend:
    name: backend / changes
    needs: eligibility
    runs-on: ubuntu-latest
    steps:
      - env:
          MODE: ${{ inputs.mode }}
        run: |
          test "$MODE" != invalid-failure && test "$MODE" != current-failure
          test "$MODE" != trusted-switch || test "$GITHUB_RUN_ATTEMPT" = 1
  fail_fast:
    name: Stop on first failure
    needs: eligibility
    if: inputs.mode == 'watcher-only'
    runs-on: ubuntu-latest
    steps:
      - run: sleep 300
  required_ci:
    name: Required CI / main / ${{ needs.eligibility.outputs.sha }} / ${{ needs.eligibility.outputs.head }}
    if: ${{ !cancelled() }}
    needs:
      - eligibility
      - build
      - backend
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.backend.result }}' = 'success'
