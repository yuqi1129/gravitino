name: Fixed bot fork credential preflight
on:
  push:
    branches: [bot-backport-sandbox-15014]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CHERRY_PICK_TOKEN }}
          script: |
            const {data: user} = await github.rest.users.getAuthenticated();
            core.info(JSON.stringify({credentialUser: user.login, type: user.type}));
            for (const owner of ['yuqi1129', 'timelyflow']) {
              const {data: repo} = await github.rest.repos.get({owner, repo: 'gravitino'});
              core.info(JSON.stringify({repository: repo.full_name, permissions: repo.permissions}));
              if (!repo.permissions?.push) throw new Error('Test credential cannot push ' + repo.full_name);
            }
