name: Fork CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  eligibility:
    name: Resolve fork CI eligibility
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.context.outputs.sha }}
    steps:
      - id: context
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
  build:
    name: build / changes
    needs: eligibility
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Retained successful suite'
  backend:
    name: backend / changes
    needs: eligibility
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ github.run_attempt }}' != '1'
  fail_fast:
    name: Stop on first failure
    needs: eligibility
    runs-on: ubuntu-latest
    steps:
      - run: sleep 240
  required_ci:
    name: Required CI / main / ${{ needs.eligibility.outputs.sha }} / ${{ github.sha }}
    if: ${{ !cancelled() }}
    needs:
      - eligibility
      - build
      - backend
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.backend.result }}' = 'success'
