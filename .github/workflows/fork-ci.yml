name: Fork CI
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [invalid-failure, invalid-success, valid-success]
        default: invalid-failure
permissions:
  contents: read
jobs:
  eligibility:
    name: Resolve fork CI eligibility
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.context.outputs.sha }}
    steps:
      - id: context
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = valid-success ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo 'sha=0000000000000000000000000000000000000001' >> "$GITHUB_OUTPUT"
          fi
  build:
    name: build / changes
    needs: eligibility
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Sandbox build passed'
  backend:
    name: backend / changes
    needs: eligibility
    runs-on: ubuntu-latest
    steps:
      - env:
          MODE: ${{ inputs.mode }}
        run: test "$MODE" != invalid-failure
  required_ci:
    name: Required CI / main / ${{ needs.eligibility.outputs.sha }} / ${{ github.sha }}
    if: ${{ !cancelled() }}
    needs:
      - eligibility
      - build
      - backend
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.backend.result }}' = 'success'
