name: Central bot backport regression tests
on:
  push:
    branches: [bot-backport-sandbox-15014]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yuqi1129/gravitino
          ref: 33e38d02ee5f148325e5df041d4474cdd353e7e6
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test .github/scripts/tests/*.test.cjs
