name: Fixed bot fork credential preflight
on:
  push:
    branches: [bot-backport-sandbox-15014]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          BOT_TOKEN: ${{ secrets.BACKPORT_BOT_TOKEN }}
        with:
          script: |
            const raw = process.env.BOT_TOKEN || '';
            const token = raw.trim();
            core.setSecret(token);
            const kind = /^ghp_[A-Za-z0-9]+$/.test(token) ? 'classic PAT' :
              /^github_pat_[A-Za-z0-9_]+$/.test(token) ? 'fine-grained PAT' : 'unrecognized';
            core.info(JSON.stringify({secretPresent: !!raw, surroundingWhitespace: raw !== token, format: kind}));
            if (kind === 'unrecognized') {
              core.setFailed('Secret is not in an expected personal access token format; replace it with the token value, not its name or URL.');
              return;
            }
            const bot = new github.constructor({auth: token});
            try {
              const {data: user} = await bot.rest.users.getAuthenticated();
              core.info(JSON.stringify({credentialUser: user.login, type: user.type}));
              if (user.login !== 'yuqi-datastrato') throw new Error('Unexpected credential owner');
              const {data: repo} = await bot.rest.repos.get({owner:'yuqi-datastrato',repo:'gravitino'});
              core.info(JSON.stringify({repository: repo.full_name, permissions: repo.permissions}));
              if (!repo.permissions?.push) throw new Error('Test credential cannot push the bot fork');
            } catch (error) {
              core.setFailed(error.status ? 'Bot credential API verification failed: HTTP ' + error.status : error.message);
            }
