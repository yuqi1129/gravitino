name: Iceberg REST Trino Integration Test

# Verifies Gravitino authorization is enforced when an Iceberg REST Catalog served
# in auxiliary mode is accessed through Trino's native iceberg REST connector.
# The module uses a Java 24 toolchain (Trino 478) and runs in deploy mode against
# the built distribution, so it needs its own job rather than the catch-all backend IT.
on:
  push:
    branches: [ "main", "branch-*" ]
  pull_request:
    branches: [ "main", "branch-*" ]
  workflow_call:

concurrency:
  group: fork-ci-iceberg-rest-trino-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    # Direct push and pull_request runs are for copies of the repository that are not
    # forks; apache/gravitino and its forks run this workflow through Fork CI.
    if: >-
      (github.repository != 'apache/gravitino' && !github.event.repository.fork) ||
      !contains(github.workflow_ref, '/.github/workflows/iceberg-rest-trino-integration-test.yml@') ||
      !contains(fromJSON('["push", "pull_request"]'), github.event_name)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-and-sync
        id: checkout
      - name: Disable Git automatic maintenance
        run: git config --local maintenance.auto false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.checkout.outputs.synced == 'true' && steps.checkout.outputs.base-sha || steps.checkout.outputs.base-ref }}
          ref: ${{ steps.checkout.outputs.synced == 'true' && steps.checkout.outputs.head-sha || github.ref }}
          filters: |
            source_changes:
              - .github/**
              - api/**
              - catalogs/catalog-common/**
              - clients/client-java/**
              - common/**
              - core/**
              - server-common/**
              - iceberg/**
              - integration-test-common/**
              - gradle/**
              - build.gradle.kts
              - gradle.properties
              - gradlew
              - settings.gradle.kts
    outputs:
      source_changes: ${{ steps.filter.outputs.source_changes }}

  IcebergRestTrinoIT:
    needs: changes
    if: needs.changes.outputs.source_changes == 'true'
    strategy:
      matrix:
        architecture: [linux/amd64]
        java-version: [ 17 ]
    uses: ./.github/workflows/iceberg-rest-trino-integration-test-action.yml
    with:
      architecture: ${{ matrix.architecture }}
      java-version: ${{ matrix.java-version }}
